<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión — Hecho</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-mode="login">
  <main class="auth">
    <a class="logo" href="/">Hecho</a>
    <h1>Inicia sesión</h1>
    <div class="card">
      <form id="authForm" novalidate>
        
        <div class="field">
          <label for="email">Correo</label>
          <input id="email" name="email" type="email" autocomplete="email" required maxlength="120">
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="1" required>
        </div>
        <p id="formError" class="form-error" role="alert" hidden></p>
        <button class="btn full" type="submit">Entrar</button>
      </form>
    </div>
    <p class="auth-switch">¿Aún no tienes cuenta? <a href="/register">Regístrate</a></p>
  </main>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
