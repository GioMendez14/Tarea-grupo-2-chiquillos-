<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta — Hecho</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-mode="register">
  <main class="auth">
   <a class="logo" href="/"><img src="/img/logo.png" alt="Hecho"></a>
    <h1>Crea tu cuenta</h1>
    <div class="card">
      <form id="authForm" novalidate>
        <div class="field">
          <label for="name">Nombre</label>
          <input id="name" name="name" type="text" autocomplete="name" required minlength="2" maxlength="60">
        </div>
        <div class="field">
          <label for="email">Correo</label>
          <input id="email" name="email" type="email" autocomplete="email" required maxlength="120">
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
        </div>
        <p id="formError" class="form-error" role="alert" hidden></p>
        <button class="btn full" type="submit">Crear cuenta</button>
      </form>
    </div>
    <p class="auth-switch">¿Ya tienes cuenta? <a href="/login">Inicia sesión</a></p>
  </main>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
