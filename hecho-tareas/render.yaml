# Blueprint opcional para Render (plan gratuito). Ver README.
services:
  - type: web
    name: hecho-tareas
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "22"
